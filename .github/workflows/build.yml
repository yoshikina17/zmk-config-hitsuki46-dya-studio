name: Build ZMK firmware

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        continue-on-error: true
        env:
          cache_name: cache-west-modules
        with:
          path: dependencies/
          key: ${{ runner.os }}-build-${{ env.cache_name }}-${{ hashFiles('config/west*.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache_name }}-

      - name: West Init & Update
        run: |
          git config --global --add safe.directory ${{ github.workspace }}
          west init -l config --mf west-standalone.yml
          west update --narrow
          west zephyr-export

      - name: Build
        run: west zmk-build -d ./build -q

      - name: Collect UF2 artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          find ./build -type f -path '*/zephyr/zmk.uf2' | while read -r f; do
            echo "Found: $f"
            # Extract a meaningful name from the path
            name=$(echo "$f" | sed -E 's|.*/([^/]+)/zephyr/zmk.uf2|\1|')
            cp "$f" "artifacts/${name}.uf2"
          done
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hitsuki46-firmware
          path: artifacts/*.uf2
          if-no-files-found: warn
